name: Check and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Select the runner's Chrome installation
        run: |
          chrome_path="$(command -v google-chrome)"
          echo "BROWSER_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - run: npm test
      - run: bash -n scripts/deploy.sh
      - run: docker build --tag youshu-studio:ci .
