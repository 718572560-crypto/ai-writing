<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 有术 Studio</title><link rel="stylesheet" href="./styles.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f5f1}main{width:min(100%,420px);background:#fff;border:1px solid #dce3d9;border-radius:8px;padding:32px}h1{font-size:26px;margin:0 0 8px;color:#204e43}.muted{color:#64716b;font-size:14px}label{display:grid;gap:7px;margin-top:18px;font-size:14px}input{font:inherit;padding:12px;border:1px solid #cbd5cc;border-radius:5px}button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:5px;background:#24584c;color:#fff;font:inherit;cursor:pointer}#message{min-height:22px;color:#9d4437;font-size:14px;margin:12px 0 0}.brand{display:inline-flex;margin-bottom:24px;color:#24584c;text-decoration:none}</style><link rel="stylesheet" href="./polish.css"></head>
<body class="account-page"><main class="account-card"><a class="brand" href="/">有术 Studio</a><h1>登录工作室</h1><p class="muted">你的作品与会员权益保存在个人账号中。</p><form id="login"><label>账号 / 邮箱<input name="email" type="text" autocomplete="username" required maxlength="254"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button type="submit">登录</button><p id="message" role="status"></p></form><section id="wechat-login-section" style="margin-top:20px;padding-top:18px;border-top:1px solid #e3e8e1"><button id="wechat-login" type="button" style="background:#07c160;margin-top:0" disabled>正在检查微信登录配置…</button><p id="wechat-help" class="muted" role="status" style="margin-bottom:0">微信登录状态检查中…</p></section><p class="muted">尚未开通账号？请联系管理员。</p></main><script src="./account.js" defer></script></body></html>
