<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <meta name="description" content="有术创作工作室，把灵感变成好内容。选题构思、文章编辑、素材收藏与作品管理。">
  <title>有术 Studio · 创作工作室</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./membership.css">
  <link rel="stylesheet" href="./workspace.css">
  <link rel="stylesheet" href="./polish.css">
  <link rel="stylesheet" href="./writing-workflow.css">
  <script src="./chat-workspace.js" defer></script>
  <script src="./writing-tools.js" defer></script>
  <script src="./studio-request.js" defer></script>
  <script src="./writing-workflow.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <a class="brand" href="#home"><span class="brand-icon">术<span>✦</span></span><span>有术<span class="brand-en">YOUSHU STUDIO</span></span></a>
    <div class="workspace-label"><span class="tiny-square">有</span>我的创作空间<span class="space-dot"></span></div>
    <div class="nav-label">工作空间</div>
    <nav>
      <a href="#home" data-nav="home"><span data-icon="grid"></span>创作首页</a>
      <a href="#write" data-nav="write"><span data-icon="pen"></span>AI 写作<span class="nav-badge">NEW</span></a>
      <a href="#library" data-nav="library"><span data-icon="book"></span>灵感文章库</a>
      <a href="#history" data-nav="history"><span data-icon="clock"></span>创作记录<span id="history-count" class="count">0</span></a>
      <a href="#favorites" data-nav="favorites"><span data-icon="bookmark"></span>我的收藏</a>
      <a href="#membership" data-nav="membership"><span data-icon="spark"></span>会员与次数</a>
      <a href="/admin" data-admin-nav hidden><span data-icon="settings"></span>后台管理</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="studio-note"><span class="note-star">✳</span><strong>好内容，值得慢慢打磨。</strong><p>从一句灵感，到一篇好文章。<br>有术，陪你认真写。</p><button class="text-btn" data-action="guide">探索创作指南 <span>↗</span></button></div>
      <button class="side-settings" data-action="settings"><span data-icon="settings"></span>工作室设置</button>
      <div class="profile"><span class="avatar">创</span><span><strong>创作者</strong><small>本地个人工作室</small></span><span class="profile-dot"></span></div>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="breadcrumb"><button class="mobile-menu icon-btn" data-action="menu" aria-label="展开导航" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button><span>工作空间</span><span class="crumb-slash">/</span><strong id="page-title">创作首页</strong></div><div class="top-actions"><button class="search-trigger" data-action="search" aria-label="搜索你的创作"><span data-icon="search"></span><span>搜索你的创作</span><kbd>Ctrl K</kbd></button><button class="icon-btn help-button" data-action="guide" aria-label="创作指南"><span data-icon="help"></span></button><span class="top-avatar">创</span></div></header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span>有术 · 让表达更有力量</span><span id="service-state"><i></i>本地创作空间</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
